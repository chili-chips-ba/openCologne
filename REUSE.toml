# When several annotations match a file, the LAST one in this file wins.
# Order: project-wide default first, then third-party exceptions.
#
#   precedence = "closest"  -> a file's own SPDX/copyright header wins; the
#                              annotation fills in only what the file lacks
#   precedence = "override" -> this annotation applies even if the file says otherwise
#
# The Amaranth and amaranth-boards git submodules (1.Blinky--*/4.amaranth/)
# are independent repositories under their own terms; REUSE does not cover
# submodules.

